AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Backend services for the Veyron admin portal inventory management workflow.

Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref ProductsTable
        BUCKET_NAME: !Ref ProductImagesBucket
        URL_EXPIRY_SECONDS: !Ref SignedUrlExpiry
        ALLOWED_ORIGINS: !Ref AllowedOrigins

Parameters:
  StageName:
    Type: String
    Default: prod
    Description: API Gateway deployment stage.
  AllowedOriginSingle:
    Type: String
    Default: "https://main.d1orae4bhxx3yj.amplifyapp.com"
    Description: Comma separated list of origins allowed to call the API.
  AllowedOriginsList:
    Type: CommaDelimitedList
    Default: "https://main.d1orae4bhxx3yj.amplifyapp.com"
    Description: Comma separated list of origins allowed to call the API.
  SignedUrlExpiry:
    Type: Number
    Default: 900
    Description: Validity window in seconds for generated S3 pre-signed upload URLs.
  OrderRecipientEmail:
    Type: String
    Default: hildamachando4@gmail.com
    Description: Email address that receives storefront order notifications.
  OrderSenderEmail:
    Type: String
    Default: no-reply@veyron-enterprises.com
    Description: Verified Amazon SES identity used to send storefront order notifications.
  OrderSendCustomerCopy:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
    Description: Set to 'true' to CC the customer on order notification emails.

Resources:
  AdminApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref StageName
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'content-type,x-api-key,authorization'"
        AllowOrigin: !Sub "'${AllowedOriginSingle}'"

  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: !Sub "${AWS::StackName}-products"
      AttributeDefinitions:
        - AttributeName: Category
          AttributeType: S
        - AttributeName: ProductId
          AttributeType: S
      KeySchema:
        - AttributeName: Category
          KeyType: HASH
        - AttributeName: ProductId
          KeyType: RANGE

  ProductImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-product-images-${AWS::Region}-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Split [ ",", !Ref AllowedOriginsList ]
            AllowedMethods:
              - GET
              - PUT
              - POST
              - HEAD
            AllowedHeaders:
              - "*"
            ExposedHeaders:
              - ETag
            MaxAge: 3600

  ProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src
      Handler: handlers/products.handler
      Description: Handles inventory sync, catalog CRUD and image upload URL generation for the admin UI.
      Events:
        SyncInventory:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /sync
            Method: post
        ListProducts:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /products
            Method: get
        GetProduct:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /products/{category}/{id}
            Method: get
        PutProduct:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /products/{category}/{id}
            Method: put
        DeleteProduct:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /products/{category}/{id}
            Method: delete
        CreateUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /products/{category}/{id}/images
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - S3CrudPolicy:
            BucketName: !Ref ProductImagesBucket
      Tracing: Active

  OrderNotificationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src
      Handler: handlers/orders.handler
      Description: Accepts storefront orders and emails the operations team via Amazon SES.
      Environment:
        Variables:
          ORDER_RECIPIENT: !Ref OrderRecipientEmail
          ORDER_SENDER: !Ref OrderSenderEmail
          ORDER_SEND_CUSTOMER_COPY: !Ref OrderSendCustomerCopy
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          SES_REGION: !Ref AWS::Region
      Events:
        SubmitOrder:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /orders
            Method: post
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendRawEmail
            Resource: "*"

Outputs:
  ApiUrl:
    Description: Base URL for the admin API.
    Value: !Sub "https://${AdminApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
  ProductsTableName:
    Description: DynamoDB table storing catalogue items.
    Value: !Ref ProductsTable
  ProductImagesBucketName:
    Description: S3 bucket that stores uploaded product images.
    Value: !Ref ProductImagesBucket
